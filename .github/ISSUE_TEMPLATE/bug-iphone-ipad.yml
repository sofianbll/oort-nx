name: Bug on iPhone or iPad
description: A reproducible problem in the Oort NX iPhone and iPad alpha. Français ou English.
title: "[Bug][iPhone-iPad] "
labels: ["bug", "iphone-ipad"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem or leak: report it [privately](https://github.com/sofianbll/oort-nx/security/advisories/new), not here.
        Do not attach keys, games, saves, personal information or raw logs.
  - type: input
    id: version
    attributes:
      label: Oort NX version and iOS or iPadOS version / Version d'Oort NX et d'iOS ou iPadOS
      placeholder: "0.1.0-alpha.1 · iPadOS 27.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model / Modèle de l'appareil
      placeholder: "iPhone 18 Pro, iPad Pro 11-inch (M5)"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source / Source
      options:
        - Oort NX
        - nxnative
        - Nextendo
        - Steam
        - Unknown / Inconnue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Étapes pour reproduire
      description: The fewest steps, with synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behaviour / Comportement attendu et observé
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostics / Diagnostic relu
      description: Only the failing step and the error message, if relevant. No full report or personal paths.
