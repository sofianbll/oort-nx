name: Suggest an improvement
description: Tell us what you need to do in Oort NX.
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Where do you get stuck? Do not include private data or game files.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would help?
      description: Describe the smallest useful change. Link a related issue if one exists.
    validations:
      required: true
