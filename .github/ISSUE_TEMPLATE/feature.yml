name: Idea or need
description: Tell us what you are trying to do. Français ou English.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do? / Que voulez-vous faire ?
      description: Where do you get stuck? Do not include private data or game files.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would help? / Qu'est-ce qui aiderait ?
      description: Describe the smallest useful change. Link a related issue if one exists.
    validations:
      required: true
