name: Game compatibility
description: Tell us how a game starts, plays or fails. Français ou English. No game files.
title: "[Game] "
labels: ["game"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach game files, keys, saves, dumps or screenshots that show personal data.
        Give the game's public title and, if you know it, its title ID. Never a file path.
  - type: input
    id: game
    attributes:
      label: Game title / Titre du jeu
      description: Public title only.
    validations:
      required: true
  - type: input
    id: title-id
    attributes:
      label: Title ID (optional) / Title ID (facultatif)
      placeholder: "0100000000000000"
  - type: dropdown
    id: system
    attributes:
      label: System / Système
      options:
        - macOS
        - Windows
        - Linux
        - Android
        - iPhone or iPad / iPhone ou iPad
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine version or commit / Version ou commit du moteur
      description: Shown in Settings → Setup and engine.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result / Résultat
      options:
        - Starts and plays / Démarre et se joue
        - Starts with problems / Démarre avec des problèmes
        - Does not start / Ne démarre pas
        - Not tested yet / Pas encore testé
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you tried and what you saw / Ce que vous avez tenté et observé
      description: Only the synthetic steps and the visible result.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Confidentialité
      options:
        - label: I did not include game files, keys, saves or personal paths. / Je n'ai joint ni fichier de jeu, ni clé, ni sauvegarde, ni chemin personnel.
          required: true
