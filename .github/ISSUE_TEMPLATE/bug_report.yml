name: Bug report
description: Describe a reproducible problem in Oort NX.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a vulnerability or leak [privately](https://github.com/sofianbll/oort-nx/security/advisories/new).
        Do not attach keys, games, saves, personal information or raw logs.
  - type: input
    id: version
    attributes:
      label: Oort NX and macOS versions
      description: Include your engine version or commit if it matters.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Name the source (Oort NX, nxnative, Nextendo, Steam or unknown). Use the fewest steps and synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostics
      description: Only the failing step, error code and Xcode or Metal version if relevant. No full diagnostics, paths, commands or screenshots.
