# Publie gh-pages sur Firebase Hosting (oortnx.web.app) à chaque push sur gh-pages.
name: Firebase Hosting
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fichiers du site
        run: rsync -a --exclude .git --exclude .github --exclude firebase.json --exclude public ./ public/
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OORT_NX }}
          projectId: oort-nx
          channelId: live
