name: Checks

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac / tests
    # GitHub-hosted public preview; do not register a self-hosted runner.
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Publication inputs
        run: |
          xcodebuild -version
          python3 scripts/check_publication.py
          python3 scripts/check_localizations.py
          python3 scripts/generate_oort_tokens.py --check
          python3 scripts/check_selene_tokens.py
      - name: Publication check regressions
        run: python3 -m unittest discover -s Tests/PublicationChecks
      - name: Selene baseline can only shrink
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_selene_tokens.py --base HEAD^1
      - name: Swift tests
        run: |
          home="$(mktemp -d "$RUNNER_TEMP/oort-home.XXXXXX")"
          HOME="$home" CFFIXED_USER_HOME="$home" swift test --jobs 6
      - name: Application regressions without UI
        run: |
          for check in Tests/CatalogAppChecks/run_*.py; do
            python3 "$check" || exit 1
          done
      - name: Release compilation
        run: swift build -c release --product NXLibrary
