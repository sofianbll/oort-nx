name: Diagnostic Cloud Screens

# Temporary: samples hosted images for the Cloud Screens reference swap. Removed once the cause is fixed.
'on':
  push:
    branches: [fix/ci-probes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs:
    name: Bundle ctime (${{ matrix.copy }})
    runs-on: xcode-27
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which fixture step changes the bundle later
        run: |
          csrutil status || true
          spctl --status || true
          systemextensionsctl list || true
          python3 -I .github/diag/fs_touch.py
          python3 -I .github/diag/fs_touch.py separate swap

  probe:
    name: Cloud Screens (${{ matrix.copy }})
    if: ${{ false }}
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned local-transport fixture
        run: |
          dir="$RUNNER_TEMP/oort-rclone"
          mkdir "$dir"
          cd "$dir"
          archive=rclone-v1.76.0-osx-arm64.zip
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/rclone/rclone/releases/download/v1.76.0/$archive"
          echo "e72dc90b70f4947a7b72b61bde4a4fbba5777b2874fb448951ffdde67ebd0ab7  $archive" | shasum -a 256 -c
          unzip -q "$archive"
          echo "OORT_PROBE_RCLONE=$dir/${archive%.zip}/rclone" >> "$GITHUB_ENV"
      - name: Install CPU OCR for AppKit captures
        working-directory: Tests/CatalogAppChecks/ocr
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "OORT_PROBE_OCR=$PWD/read.cjs" >> "$GITHUB_ENV"
      - name: Volumes
        run: |
          mount
          df -h "$PWD" "$RUNNER_TEMP" "$HOME"
      - name: Cloud Screens
        run: |
          build_home="$HOME"
          home="$(mktemp -d "$RUNNER_TEMP/oort-home-XXXXXX")"
          HOME="$home" CFFIXED_USER_HOME="$home" OORT_PROBE_BUILD_HOME="$build_home" \
            python3 Tests/CatalogAppChecks/run_cloud_screens.py
