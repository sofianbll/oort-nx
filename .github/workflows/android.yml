name: Android

# Runs on the alpha branch or by hand. The published APK is signed outside GitHub.
'on':
  workflow_dispatch:
  push:
    branches: [alpha/android]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Android / checks that need no SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tokens, resources, bracket balance, no network permission
        run: |
          python3 scripts/generate_oort_android_tokens.py --check
          python3 -m unittest discover -s Tests/AndroidChecks
      - name: The cloud against the Mac's own numbers
        run: python3 -I android/tools/verify_cloud.py

  apk:
    name: Android / unit tests and APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty unless the repository holds them: then the release APK is signed, else only the debug one is made.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      # The runner image carries the Android SDK (platform 37.1, build-tools 36.0.0) and accepted licences.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.9.2'
      - name: Unit tests (the cloud and the sounds against the Mac's output)
        run: gradle -p android testDebugUnitTest
      - name: "Debug APK (debug key, installable for a first look)"
        run: gradle -p android assembleDebug
      - name: Release APK
        run: gradle -p android assembleRelease
      - name: Sign the release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out oort-nx-android-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs oort-nx-android-release.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oort-nx-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            oort-nx-android-release.apk
            android/app/build/reports/tests/
