# Weekly update checks for dependencies. Dependabot only opens pull requests; the maintainer reviews and merges them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # The manifests below exist on the alpha branches. Until they reach main,
  # Dependabot reports that it found nothing in these folders.
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
