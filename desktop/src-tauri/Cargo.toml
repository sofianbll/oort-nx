[package]
name = "oort-desktop"
version = "0.1.0-alpha.2"
description = "Oort NX for Windows and Linux"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "oort_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gilrs = "0.11"
# The system's own TLS: nothing is asked before the player says yes (online.rs).
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation_Collections",
  "Gaming_Input",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The scripted walk-through of the real window (debug builds on a Mac only).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = { version = "0.3", features = ["block2"] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
